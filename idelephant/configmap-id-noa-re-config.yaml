# Source: id.noa.re
apiVersion: v1
kind: ConfigMap
metadata:
  name: id-noa-re-config
  namespace: idelephant
  annotations:
    noa.re/manifest-id: d50eb815b026ff5b
data:
  idelephant.toml: |
    root_key = "zq.luDCkyil5qf1qCJwm5lnSe97x5mROvXUMfwpOASJ0MgalZTIj"

    origin = "https://id.noa.re"
    tls_cert_path = "/tls/tls.crt"
    tls_key_path = "/tls/tls.key"

    [email]
    sender_email = "noa@resare.com"
    relay_host = "mail.resare.com"
    username = "idelephant"
    password_file = "/email-password/password"

    [persistence]
    uri = "ws://surrealdb.surrealdb.svc:8000"
    [persistence.idmouse]
    url = "http://idmouse.idmouse.svc/token/idelephant"
    token_path = "/var/run/secrets/tokens/idmouse"
