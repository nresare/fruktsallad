# Source: grafana-editor.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-editor-noa-re
  labels:
    app: grafana-editor-noa-re
  namespace: grafana-editor
  annotations:
    noa.re/manifest-id: 5a6ceaf087b48587
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana-editor-noa-re
  template:
    metadata:
      labels:
        app: grafana-editor-noa-re
      annotations:
        checksum/config: 5c3451ac7a6b009fdb5af51822a57fe1b028f568c95524e24c9e5cf046e90c91
    spec:
      containers:
      - name: grafana-editor-noa-re
        image: public.ecr.aws/portswigger-platform/grafana-editor:0.1.0-7d4ed791
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: grafana-editor-noa-re-config
          mountPath: /config
        - name: grafana-token
          mountPath: /grafana-token
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
      volumes:
      - name: tls
        secret:
          secretName: grafana-editor-noa-re-internal-tls
      - name: grafana-editor-noa-re-config
        configMap:
          name: grafana-editor-noa-re-config
      - name: grafana-token
        secret:
          secretName: grafana-token
