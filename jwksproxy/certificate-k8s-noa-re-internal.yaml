# Source: k8s.noa.re
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-noa-re-internal
  namespace: jwksproxy
  annotations:
    noa.re/manifest-id: 1834edaacab99b13
spec:
  dnsNames:
  - k8s-noa-re.jwksproxy.svc
  duration: 2160h
  issuerRef:
    name: cluster-local
    kind: ClusterIssuer
