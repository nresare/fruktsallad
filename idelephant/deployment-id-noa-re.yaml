# Source: id.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: id-noa-re
  labels:
    app: id-noa-re
  namespace: idelephant
  annotations:
    noa.re/manifest-id: 8c187fd539d663df
spec:
  replicas: 1
  selector:
    matchLabels:
      app: id-noa-re
  template:
    metadata:
      labels:
        app: id-noa-re
      annotations:
        checksum/config: 6e754506729ebbe5204edd293419f4479de5d2fb79b6f44f60b41deda6316254
    spec:
      containers:
      - name: id-noa-re
        image: repo.noa.re/idelephant:0.2.3-032c7cee
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - /config/idelephant.toml
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: id-noa-re-config
          mountPath: /config
        - name: email-password
          mountPath: /email-password
        - name: tokens
          mountPath: /var/run/secrets/tokens
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
      volumes:
      - name: tls
        secret:
          secretName: id-noa-re-internal-tls
      - name: id-noa-re-config
        configMap:
          name: id-noa-re-config
      - name: email-password
        secret:
          secretName: email-password
      - name: tokens
        projected:
          sources:
          - serviceAccountToken:
              path: idmouse
              expirationSeconds: 3600
              audience: idmouse
