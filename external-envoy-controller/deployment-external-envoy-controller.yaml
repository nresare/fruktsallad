# Source: external-envoy-controller
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-envoy-controller
  labels:
    app: external-envoy-controller
  namespace: external-envoy-controller
  annotations:
    noa.re/manifest-id: fcec864c06ee53e6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-envoy-controller
  template:
    metadata:
      labels:
        app: external-envoy-controller
    spec:
      containers:
      - name: external-envoy-controller
        image: repo.noa.re/external-envoy-controller:0.1.0-f4488c15
        ports:
        - name: grpc
          containerPort: 50051
        livenessProbe:
          grpc:
            port: 50051
            service: liveness
        readinessProbe:
          grpc:
            port: 50051
            service: readiness
        args:
        - --tracing-endpoint
        - http://tempo.tempo.svc:4317
