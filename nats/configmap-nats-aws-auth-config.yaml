# Source: nats-aws-auth
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-aws-auth-config
  namespace: nats
  annotations:
    noa.re/manifest-id: 435a0808bce4b60c
data:
  nats-aws-auth.toml: |
    legacy-serviceaccount-permissions = false

    [[permission]]
    subject = "system:serviceaccount:nats:jetstream-controller"
    allowed-pub-subjects = ["$JS.ACK.>", "$JS.API.>"]
    allowed-sub-subjects = ["$JS.API.>"]

    [[permission]]
    subject = "system:serviceaccount:webhook-poker:default"
    allowed-pub-subjects = [
        "$JS.API.CONSUMER.INFO.github-events.argo-poker",
        "$JS.API.CONSUMER.MSG.NEXT.github-events.argo-poker",
        "$JS.ACK.github-events.argo-poker.>",
    ]
