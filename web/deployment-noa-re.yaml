# Source: noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noa-re
  labels:
    app: noa-re
  namespace: web
  annotations:
    hugo: https://github.com/nresare/noa.re
    noa.re/deploy-id: b720b21606ad7431
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noa-re
  template:
    metadata:
      labels:
        app: noa-re
    spec:
      containers:
      - env:
        - name: SERVER_PORT
          value: '8443'
        - name: SERVER_HTTP2_TLS
          value: 'true'
        - name: SERVER_HTTP2_TLS_CERT
          value: /tls/tls.crt
        - name: SERVER_HTTP2_TLS_KEY
          value: /tls/tls.key
        name: web
        image: ghcr.io/static-web-server/static-web-server:2.44
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        volumeMounts:
        - mountPath: /public
          name: public
          readOnly: true
        - mountPath: /tls
          name: tls
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
      initContainers:
      - name: git
        image: alpine/git:v2.54.0
        command:
        - /bin/sh
        - -c
        - |-
          if [ ! -d /src/.git ]; then
            git clone https://github.com/nresare/noa.re --recurse-submodules --depth=1 /src
          else
            git pull https://github.com/nresare/noa.re --recurse-submodules
          fi
        volumeMounts:
        - mountPath: /src
          name: src
      - name: hugo
        image: floryn90/hugo:0.165.0
        volumeMounts:
        - mountPath: /src
          name: src
        - mountPath: /src/public
          name: public
      volumes:
      - name: src
        emptyDir: {}
      - name: public
        emptyDir: {}
      - name: tls
        secret:
          secretName: noa-re-internal-tls
