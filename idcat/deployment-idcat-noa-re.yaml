# Source: idcat.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idcat-noa-re
  labels:
    app: idcat-noa-re
  namespace: idcat
  annotations:
    noa.re/manifest-id: 3d7c19d3964b2e54
spec:
  replicas: 2
  selector:
    matchLabels:
      app: idcat-noa-re
  template:
    metadata:
      labels:
        app: idcat-noa-re
      annotations:
        checksum/config: e398bef93d2d5421692fdf92a6f34d077393ba4ebd3b9dd2f8d930ac05368c61
    spec:
      containers:
      - name: idcat-noa-re
        image: public.ecr.aws/portswigger-platform/idcat:934b43e7
        imagePullPolicy: IfNotPresent
        args:
        - --debug
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: idcat-noa-re-config
          mountPath: /config
        - name: app-keys
          mountPath: /app-keys
        - name: random-secrets
          mountPath: /random-secrets
        - name: tokens
          mountPath: /var/run/secrets/tokens
          readOnly: true
      volumes:
      - name: idcat-noa-re-config
        configMap:
          name: idcat-noa-re-config
      - name: app-keys
        secret:
          secretName: app-keys
      - name: random-secrets
        secret:
          secretName: idcat-noa-re
      - name: tokens
        projected:
          sources:
          - serviceAccountToken:
              path: nats
              expirationSeconds: 3600
              audience: nats
