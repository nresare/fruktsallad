# Source: id.noa.re
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: id-noa-re-internal
  namespace: idelephant
  annotations:
    noa.re/manifest-id: 23bce63cdd631e42
spec:
  dnsNames:
  - id-noa-re.idelephant.svc
  duration: 2160h
  issuerRef:
    name: cluster-local
    kind: ClusterIssuer
