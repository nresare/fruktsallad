apiVersion: v1
kind: Service
metadata:
  name: external-envoy-controller
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.168.169
    noa.re/manifest-id: 50f24e8829fe54b4
  namespace: external-envoy-controller
spec:
  type: LoadBalancer
  loadBalancerClass: kube-vip.io/kube-vip-class
  selector:
    app: external-envoy-controller
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    appProtocol: kubernetes.io/h2c
