# Source: demo.resare.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-resare-com
  labels:
    app: demo-resare-com
  namespace: oidc-client-demo
  annotations:
    noa.re/manifest-id: 6390e5715746c423
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-resare-com
  template:
    metadata:
      labels:
        app: demo-resare-com
      annotations:
        checksum/config: 7816b4136ace3f044d701bd0067396837b2e3fff9b75317f56233572ba275473
    spec:
      containers:
      - name: demo-resare-com
        image: repo.noa.re/oidc-client-demo:0.1.0-35385308
        args:
        - -c
        - /config/config.toml
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: demo-resare-com-config
          mountPath: /config
        - name: secret
          mountPath: /secret
        - name: random-secrets
          mountPath: /random-secrets
      volumes:
      - name: demo-resare-com-config
        configMap:
          name: demo-resare-com-config
      - name: secret
        secret:
          secretName: secret
      - name: random-secrets
        secret:
          secretName: demo-resare-com
