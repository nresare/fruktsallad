# Source: idfrog.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idfrog-noa-re
  labels:
    app: idfrog-noa-re
  namespace: idfrog
  annotations:
    noa.re/manifest-id: eaa2949cad63d0aa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idfrog-noa-re
  template:
    metadata:
      labels:
        app: idfrog-noa-re
      annotations:
        checksum/config: b01281e0a981c4c36e46aca3a5d57ba0837bfbed3f12e1886f5024ac223f189f
    spec:
      containers:
      - name: idfrog-noa-re
        image: nresare/idfrog:0.0.3
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - /config/idfrog.toml
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: idfrog-noa-re-config
          mountPath: /config
        - name: idfrog-entra-client
          mountPath: /idfrog-entra-client
        - name: idfrog-signing-key
          mountPath: /idfrog-signing-key
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
      volumes:
      - name: tls
        secret:
          secretName: idfrog-noa-re-internal-tls
      - name: idfrog-noa-re-config
        configMap:
          name: idfrog-noa-re-config
      - name: idfrog-entra-client
        secret:
          secretName: idfrog-entra-client
      - name: idfrog-signing-key
        secret:
          secretName: idfrog-signing-key
