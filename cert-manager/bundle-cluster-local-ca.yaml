# Source: cert-manager
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: cluster-local-ca
  namespace: cert-manager
  annotations:
    noa.re/manifest-id: 9a5dfc75ed97f9cc
spec:
  sources:
  - secret:
      name: cluster-local-ca
      key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        trust: cluster-local
