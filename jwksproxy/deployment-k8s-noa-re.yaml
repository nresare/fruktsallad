# Source: k8s.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-noa-re
  labels:
    app: k8s-noa-re
  namespace: jwksproxy
  annotations:
    noa.re/manifest-id: 1188c886db6f97a6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-noa-re
  template:
    metadata:
      labels:
        app: k8s-noa-re
      annotations:
        checksum/config: 2c38d9f04e77ea4d2316fd49f43ef7d3a1a51823c0ed341364acbe7b4f181bd1
    spec:
      containers:
      - name: k8s-noa-re
        image: repo.noa.re/jwksproxy:0.2.0-21fd437b
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: k8s-noa-re-config
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
      volumes:
      - name: tls
        secret:
          secretName: k8s-noa-re-internal-tls
      - name: k8s-noa-re-config
        configMap:
          name: k8s-noa-re-config
