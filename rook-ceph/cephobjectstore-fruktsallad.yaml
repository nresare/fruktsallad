# Source: rook-ceph
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: fruktsallad
  namespace: rook-ceph
  annotations:
    noa.re/deploy-id: adf6c6605b51894b
spec:
  metadataPool:
    failureDomain: host
    replicated:
      size: 3
  dataPool:
    failureDomain: host
    erasureCoded:
      dataChunks: 2
      codingChunks: 1
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: 2
