# Source: grafana-editor.noa.re
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-editor-noa-re
  labels:
    app: grafana-editor-noa-re
  namespace: grafana-editor
  annotations:
    noa.re/manifest-id: 3548da50dd81b8ec
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana-editor-noa-re
  template:
    metadata:
      labels:
        app: grafana-editor-noa-re
      annotations:
        checksum/config: 590fdfeafc40d3d8a15b3cb42cf12748c2851d47e3f52be4664de9d3b1db59fd
    spec:
      containers:
      - name: grafana-editor-noa-re
        image: public.ecr.aws/portswigger-platform/grafana-editor:0.1.0-29063342
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: grafana-editor-noa-re-config
          mountPath: /config
        - name: grafana-token
          mountPath: /grafana-token
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
      volumes:
      - name: tls
        secret:
          secretName: grafana-editor-noa-re-internal-tls
      - name: grafana-editor-noa-re-config
        configMap:
          name: grafana-editor-noa-re-config
      - name: grafana-token
        secret:
          secretName: grafana-token
