apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-envoy-controller
  labels:
    app: external-envoy-controller
  namespace: external-envoy-controller
  annotations:
    noa.re/manifest-id: 3cd6f8ac42dd2372
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-envoy-controller
  template:
    metadata:
      labels:
        app: external-envoy-controller
    spec:
      containers:
      - name: external-envoy-controller
        image: repo.noa.re/external-envoy-controller:0.1.0-52b7b7da
        ports:
        - name: http
          containerPort: 8080
