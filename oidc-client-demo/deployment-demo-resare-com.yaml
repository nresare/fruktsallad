# Source: demo.resare.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-resare-com
  labels:
    app: demo-resare-com
  namespace: oidc-client-demo
  annotations:
    noa.re/manifest-id: a8b04e567efe4a67
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-resare-com
  template:
    metadata:
      labels:
        app: demo-resare-com
      annotations:
        checksum/config: 8ca3e05616423f1c24583e0ad290dc47bfca23865a59a8a0e174301345018170
    spec:
      containers:
      - name: demo-resare-com
        image: repo.noa.re/oidc-client-demo:0.1.0-14717f44
        args:
        - -c
        - /config/config.toml
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: demo-resare-com-config
          mountPath: /config
        - name: secret
          mountPath: /secret
        - name: random-secrets
          mountPath: /random-secrets
      volumes:
      - name: demo-resare-com-config
        configMap:
          name: demo-resare-com-config
      - name: secret
        secret:
          secretName: secret
      - name: random-secrets
        secret:
          secretName: demo-resare-com
