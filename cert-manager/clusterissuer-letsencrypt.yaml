# Source: cert-manager
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  namespace: cert-manager
  annotations:
    noa.re/manifest-id: b3dce14fc52a141f
spec:
  acme:
    email: noa@resare.com
    privateKeySecretRef:
      name: letsenrypt-account-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        acmeDNS:
          accountSecretRef:
            key: acmedns.json
            name: acme-dns
          host: http://acme-dns.acme-dns.svc.cluster.local
        cnameStrategy: Follow
